<svg width="420" height="180" viewBox="0 0 420 180" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
    .title { fill: #58a6ff; font: 600 15px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
    .label { fill: #e6edf3; font: 400 12px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="419" height="179" rx="10"/>
  <text x="20" y="30" class="title">Top Languages</text>

  <!-- stacked bar: Python 43.6, TypeScript 33.8, JavaScript 12.6, HTML 6.0, CSS 2.7, other 1.3 -->
  <g transform="translate(20,45)">
    <rect x="0"   y="0" width="174.4" height="10" fill="#3572A5"/>
    <rect x="174.4" y="0" width="135.2" height="10" fill="#3178c6"/>
    <rect x="309.6" y="0" width="50.4"  height="10" fill="#f1e05a"/>
    <rect x="360"   y="0" width="24"    height="10" fill="#e34c26"/>
    <rect x="384"   y="0" width="10.8"  height="10" fill="#563d7c"/>
    <rect x="394.8" y="0" width="5.2"   height="10" fill="#8b949e"/>
  </g>

  <g transform="translate(20,75)">
    <circle cx="4" cy="0" r="4" fill="#3572A5"/>
    <text x="14" y="4" class="label">Python 43.6%</text>

    <circle cx="4" cy="22" r="4" fill="#3178c6"/>
    <text x="14" y="26" class="label">TypeScript 33.8%</text>

    <circle cx="4" cy="44" r="4" fill="#f1e05a"/>
    <text x="14" y="48" class="label">JavaScript 12.6%</text>

    <circle cx="160" cy="0" r="4" fill="#e34c26"/>
    <text x="170" y="4" class="label">HTML 6.0%</text>

    <circle cx="160" cy="22" r="4" fill="#563d7c"/>
    <text x="170" y="26" class="label">CSS 2.7%</text>

    <circle cx="160" cy="44" r="4" fill="#8b949e"/>
    <text x="170" y="48" class="label">Other 1.3%</text>
  </g>
</svg>
